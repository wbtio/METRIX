version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js
  - React
  - Tailwind CSS
  - shadcn/ui (Radix UI)
  - Supabase
  - Google Gemini
  - Mistral Voxtral
  - Recharts
  - canvas-confetti
  - react-day-picker
routes:
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: Supabase OAuth login page with Matrix Manifesto dialog
  - path: /
    file: src/app/page.tsx
    auth_required: true
    description: Main SPA with state-based navigation between home, dashboard, settings, goals, create-goal views
  - path: /auth/callback
    file: src/app/auth/callback/route.ts
    auth_required: false
    description: Supabase OAuth callback handler
features:
  - name: Authentication
    description: Supabase OAuth login with session management via middleware
    files:
      - src/app/login/page.tsx
      - src/middleware.ts
      - src/utils/supabase/client.ts
      - src/utils/supabase/server.ts
    entry_route: /login
    user_interactions:
      - Click sign-in button
      - Complete OAuth flow
      - Be redirected to home page
    api_calls:
      - method: POST
        endpoint: /auth/v1/authorize (Supabase OAuth)
    auth_required: false
  - name: Home Page
    description: Goals list with pin/unpin, voice recording for progress, navigation to dashboard/goals/settings/create-goal
    files:
      - src/app/page.tsx
      - src/components/HomePage.tsx
      - src/components/shared/VoiceRecorder.tsx
      - src/components/shared/GoalProgressBar.tsx
    entry_route: /
    user_interactions:
      - View list of goals with progress bars
      - Pin or unpin a goal
      - Click goal to view dashboard
      - Record voice input for progress logging
      - Navigate to goals list, settings, or create goal
      - View notifications bell
    api_calls:
      - method: GET
        endpoint: /rest/v1/goals (Supabase)
      - method: PATCH
        endpoint: /rest/v1/goals (Supabase pin/unpin)
      - method: GET
        endpoint: /rest/v1/tasks (Supabase)
    auth_required: true
  - name: Dashboard
    description: Goal detail view with focus tab, chart tab, and challenge tab
    files:
      - src/components/dashboard/Dashboard.tsx
      - src/components/dashboard/DashboardHeader.tsx
      - src/components/dashboard/FocusTab.tsx
      - src/components/dashboard/GrowthChart.tsx
      - src/components/dashboard/DailyFocusPanel.tsx
      - src/components/dashboard/DailyFocusQuestionDialog.tsx
      - src/components/dashboard/DayCalendarGrid.tsx
      - src/components/dashboard/ActivityHistory.tsx
      - src/components/challenge/ChallengeTab.tsx
    entry_route: / (navigate from home)
    user_interactions:
      - Switch between focus, chart, and challenge tabs
      - Answer daily focus questions
      - View growth chart with progress history
      - Start/join a challenge
      - View activity history
      - See day calendar grid with completion status
    api_calls:
      - method: GET
        endpoint: /api/goal/daily-focus
      - method: GET
        endpoint: /rest/v1/daily_logs (Supabase)
      - method: POST
        endpoint: /rest/v1/daily_logs (Supabase)
    auth_required: true
  - name: Goal Creation - AI
    description: Create goal using AI (Gemini) with investigation, planning, milestone generation, and sub-task creation
    files:
      - src/components/goal/GoalCreatorPage.tsx
      - src/components/goal/GoalCreator.tsx
      - src/components/goal/GoalTemplates.tsx
      - src/lib/gemini.ts
    entry_route: / (create-goal view)
    user_interactions:
      - Enter goal description
      - AI investigates and plans the goal
      - AI generates sub-tasks with weights and frequencies
      - AI generates milestones with images
      - Select from goal templates
      - Save goal
    api_calls:
      - method: POST
        endpoint: /api/goal/investigate
      - method: POST
        endpoint: /api/goal/plan
      - method: POST
        endpoint: /api/goal/milestone/image
      - method: POST
        endpoint: /rest/v1/goals (Supabase)
      - method: POST
        endpoint: /rest/v1/tasks (Supabase)
    auth_required: true
  - name: Goal Creation - Manual
    description: Manually create goal with custom dates, points, icon, colors, and tasks
    files:
      - src/components/goal/ManualGoalCreator.tsx
      - src/components/goal/GoalInput.tsx
      - src/components/goal/IconPicker.tsx
      - src/components/goal/TaskColorPicker.tsx
      - src/components/goal/TaskAppearancePicker.tsx
    entry_route: / (create-goal view)
    user_interactions:
      - Enter goal title and description
      - Select icon and task colors
      - Set target points and dates
      - Add tasks with frequency (daily/weekly) and weight
      - Save goal
    api_calls:
      - method: POST
        endpoint: /rest/v1/goals (Supabase)
      - method: POST
        endpoint: /rest/v1/tasks (Supabase)
    auth_required: true
  - name: Daily Progress Logging
    description: Log daily progress for a goal with text or voice input, AI evaluation scoring
    files:
      - src/components/progress/ProgressLogDialog.tsx
      - src/components/progress/DailyLogModal.tsx
      - src/components/shared/VoiceRecorder.tsx
      - src/lib/daily-log-feedback.ts
      - src/lib/gemini.ts
    entry_route: / (from dashboard)
    user_interactions:
      - Open progress log dialog
      - Enter text or record voice
      - Submit for AI evaluation
      - Receive score and feedback
      - Close dialog
    api_calls:
      - method: POST
        endpoint: /api/goal/evaluate
      - method: POST
        endpoint: /api/transcribe
      - method: POST
        endpoint: /rest/v1/daily_logs (Supabase)
    auth_required: true
  - name: Challenges 1v1
    description: Create or join 1v1 challenges between two users with score tracking and rewards
    files:
      - src/components/challenge/ChallengeTab.tsx
      - src/components/challenge/ActivityCard.tsx
      - src/components/challenge/BoardCard.tsx
      - src/components/challenge/ScoreCard.tsx
      - src/components/challenge/EndChallengeDialog.tsx
      - src/components/challenge/HistoryCard.tsx
      - src/components/challenge/RewardsSection.tsx
      - src/app/api/challenges/create/route.ts
      - src/app/api/challenges/join/route.ts
      - src/app/api/challenges/end/route.ts
      - src/app/api/challenges/by-goal/route.ts
      - src/app/api/challenges/history/route.ts
    entry_route: / (from dashboard challenge tab)
    user_interactions:
      - Create a challenge against another user
      - Join an existing challenge via code
      - View challenge scoreboard
      - End challenge and see results
      - View challenge history
      - Collect rewards
    api_calls:
      - method: POST
        endpoint: /api/challenges/create
      - method: POST
        endpoint: /api/challenges/join
      - method: POST
        endpoint: /api/challenges/end
      - method: GET
        endpoint: /api/challenges/by-goal
      - method: GET
        endpoint: /api/challenges/history
    auth_required: true
  - name: Settings
    description: User settings including language toggle, Telegram integration, goal management, and notifications
    files:
      - src/components/settings/SettingsPage.tsx
      - src/components/goal/GoalEditDialog.tsx
      - src/components/goal/GoalsList.tsx
      - src/components/shared/ThemeToggle.tsx
      - src/components/notifications/NotificationsSection.tsx
    entry_route: / (settings view)
    user_interactions:
      - Change language (Arabic/English RTL/LTR)
      - Connect/disconnect Telegram bot
      - Edit goal settings
      - Toggle notifications
      - View all goals and delete/archive
    api_calls:
      - method: GET
        endpoint: /api/telegram/status
      - method: POST
        endpoint: /api/telegram/link
      - method: POST
        endpoint: /api/telegram/disconnect
      - method: GET
        endpoint: /rest/v1/goals (Supabase)
      - method: DELETE
        endpoint: /rest/v1/goals (Supabase)
    auth_required: true
  - name: Streak Notifications
    description: Toast notifications for streak maintenance reminders and daily reminders
    files:
      - src/hooks/useStreakReminder.ts
      - src/hooks/useNotifications.ts
      - src/components/dashboard/ToastNotification.tsx
    entry_route: /
    user_interactions:
      - See streak reminder notification toast
      - Click notification to log progress
      - Dismiss notification
    api_calls:
      - method: GET
        endpoint: /rest/v1/daily_logs (Supabase)
    auth_required: true
  - name: Notifications Center
    description: View and manage system notifications and goal reminders
    files:
      - src/hooks/useNotifications.ts
      - src/components/notifications/NotificationsSection.tsx
    entry_route: /
    user_interactions:
      - View unread notifications
      - Mark notifications as read
      - Navigate to related goal from notification
    api_calls:
      - method: GET
        endpoint: /rest/v1/notifications (Supabase)
      - method: PATCH
        endpoint: /rest/v1/notifications (Supabase)
    auth_required: true
  - name: Progress Visualization
    description: View growth charts and activity history for goal progress tracking
    files:
      - src/components/dashboard/GrowthChart.tsx
      - src/components/dashboard/ActivityHistory.tsx
      - src/components/dashboard/TaskInsights.tsx
      - src/components/shared/GoalProgressBar.tsx
      - src/components/shared/StreakFlame.tsx
    entry_route: / (chart tab)
    user_interactions:
      - View line chart of progress over time
      - See activity history with scores
      - View task completion insights
      - See streak flame indicator
    api_calls:
      - method: GET
        endpoint: /rest/v1/daily_logs (Supabase)
      - method: GET
        endpoint: /rest/v1/tasks (Supabase)
    auth_required: true
known_limitations:
  - issue: Voice transcription depends on Mistral API key with no practical fallback
    location: src/lib/gemini.ts, src/components/shared/VoiceRecorder.tsx
    impact: Voice recording fails silently if Mistral API is unavailable
  - issue: AI goal creation always sends empty structured_input field
    location: src/components/goal/GoalCreatorPage.tsx
    impact: structured_input is never used for goal creation
  - issue: AI-generated goals hardcode target_points to 10000
    location: src/components/goal/GoalCreatorPage.tsx
    impact: Users cannot set custom target points for AI-generated goals
  - issue: Manual goal creator is the only way to set custom dates and points before save
    location: src/components/goal/ManualGoalCreator.tsx
    impact: AI goal creation lacks flexibility in point/date configuration
  - issue: The app is a single-page application with client-side navigation only, not multi-page routing
    location: src/app/page.tsx
    impact: Direct URL access to specific views (e.g., /dashboard) does not work
  - issue: Middleware redirects unauthenticated users to /login but SPA view state is not preserved on refresh
    location: src/middleware.ts, src/app/page.tsx
    impact: Users lose their current view state when refreshing the page
